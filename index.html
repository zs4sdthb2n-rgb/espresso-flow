<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#161412" />
  <link rel="manifest" href="manifest.json" />
  <title>Espresso Shot Log</title>
  <style>
    :root { --bg: #161412; --card: #221f1d; --accent: #d97706; --text: #f5f5f4; --muted: #a8a29e; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.25rem; margin: 0; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: #292524; color: var(--muted); }
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    label { font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #3f3a36; background: #161412; color: var(--text); font-size: 0.95rem; }
    button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
    button.secondary { background: #332e2a; color: var(--text); margin-top: 8px; }
    .actions { display: flex; gap: 8px; }
    canvas { width: 100%; height: 180px; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #2e2a27; }
    th { color: var(--muted); font-weight: 500; }
    .unsynced { color: #fbbf24; font-size: 0.7rem; }
  </style>
</head>
<body>
  <header>
    <h1>☕ Espresso Log</h1>
    <span id="status" class="badge">Local Storage</span>
  </header>

  <!-- Visualization Card -->
  <div class="card">
    <label>Yield (g) & Time (s) — Last 15 Shots</label>
    <canvas id="chart"></canvas>
  </div>

  <!-- Log New Shot Form -->
  <div class="card">
    <div class="row">
      <div><label>Grind</label><input type="number" id="grind" value="17" step="0.5" /></div>
      <div><label>Dose In (g)</label><input type="number" id="weight" value="18.0" step="0.1" /></div>
      <div><label>Yield Out (g)</label><input type="number" id="out" value="40.0" step="0.1" /></div>
    </div>
    <div class="row">
      <div><label>Time (s)</label><input type="number" id="time" value="35" /></div>
      <div><label>Pressure (bar)</label><input type="number" id="pressure" value="9.0" step="0.1" /></div>
      <div><label>Bean ID</label><input type="number" id="bean_id" value="12345" /></div>
    </div>
    <button id="saveBtn">Save Shot</button>
    <div class="actions">
      <button class="secondary" id="syncBtn">Sync ESP32</button>
      <button class="secondary" id="exportBtn">Export .jsonl</button>
      <button class="secondary" id="importBtn">Import .jsonl</button>
      <input type="file" id="fileInput" accept=".jsonl,.txt" hidden />
    </div>
  </div>

  <!-- ESP32 Host Setting -->
  <div class="card">
    <label>ESP32 Address (optional, e.g. http://espresso.local or http://192.168.1.50)</label>
    <input type="text" id="espHost" placeholder="http://espresso.local" />
  </div>

  <!-- History Table -->
  <div class="card">
    <table>
      <thead>
        <tr><th>Date</th><th>Grind</th><th>In/Out</th><th>Time</th><th>Bar</th><th>Bean</th></tr>
      </thead>
      <tbody id="shotList"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
